<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>Offline</title>

    <style>
      body {
        margin: 0;

        font-family: Arial, sans-serif;

        display: flex;

        justify-content: center;

        align-items: center;

        height: 100vh;

        background: #f8fafc;
      }

      .card {
        padding: 40px;

        border-radius: 15px;

        background: white;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);

        text-align: center;
      }

      h1 {
        margin-bottom: 10px;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>You're Offline</h1>

      <p>Please reconnect to continue syncing your data.</p>
    </div>
  </body>
</html>
